
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFL Game Day Specials | Hook Fish & Chicken</title>

<style>
:root {
  --brand:#2b328b;
  --card:#f5f5f5;
  --radius:16px;
}

* {
  box-sizing:border-box;
}

html,body {
  margin:0;
  padding:0;
}

body {
  font-family:Arial,Helvetica,sans-serif;
  background:#ffffff;
  color:#111111;
  text-align:center;
  padding-bottom:95px;
}

.shell {
  max-width:760px;
  margin:0 auto;
  padding:16px;
}

img {
  max-width:100%;
  height:auto;
  display:block;
}

.logo {
  margin:6px 0 18px;
}

.logo img {
  width:100%;
  border-radius:12px;
}

.section {
  margin:20px 0;
}

.section h2 {
  margin:0 0 12px;
  font-size:22px;
  font-weight:900;
  color:#111111;
}

.card {
  background:var(--card);
  border-radius:var(--radius);
  padding:10px;
  margin:12px 0;
  box-shadow:0 4px 16px rgba(0,0,0,.07);
  opacity:0;
  transform:translateY(8px);
  animation:fadeUp .6s ease forwards;
  animation-delay:var(--delay,0s);
}

.card img {
  width:100%;
  border-radius:12px;
}

@keyframes fadeUp {
  to {
    opacity:1;
    transform:translateY(0);
  }
}

/* NFL Next Game */

.nfl-game {
  padding:20px 12px;
  min-height:120px;
}

.nfl-matchup {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:14px;
  margin:16px 0;
}

.nfl-team {
  width:42%;
  max-width:180px;
}

.nfl-team img {
  width:80px;
  height:80px;
  object-fit:contain;
  margin:0 auto;
}

.nfl-team-name {
  font-size:14px;
  font-weight:800;
  margin-top:10px;
}

.nfl-vs {
  font-size:20px;
  font-weight:900;
  color:var(--brand);
}

.nfl-date {
  font-size:16px;
  font-weight:800;
  margin-top:15px;
  line-height:1.5;
}

.nfl-status {
  display:inline-block;
  margin-top:12px;
  padding:7px 14px;
  background:#e8eafa;
  border-radius:20px;
  color:var(--brand);
  font-size:12px;
  font-weight:800;
}

.nfl-error {
  font-size:15px;
  line-height:1.7;
}

.nfl-error a {
  color:var(--brand);
  font-weight:800;
  text-decoration:underline;
}

/* Sticky Call Button */

.cta {
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:999;
  padding:12px 16px;
  display:flex;
  justify-content:center;
  background:rgba(255,255,255,.96);
  border-top:1px solid #eee;
}

.cta a {
  display:block;
  width:100%;
  max-width:760px;
  padding:16px 18px;
  border-radius:14px;
  background:var(--brand);
  color:#ffffff;
  font-weight:900;
  font-size:18px;
  text-decoration:none;
  box-shadow:0 6px 20px rgba(43,50,139,.2);
}

.cta a:hover {
  background:#20266c;
}

/* Mobile */

@media(max-width:480px) {
  .shell {
    padding:10px;
  }

  .section h2 {
    font-size:20px;
  }

  .nfl-team img {
    width:65px;
    height:65px;
  }

  .nfl-team-name {
    font-size:12px;
  }
}
</style>
</head>

<body>

<div class="shell">

  <!-- FIRST IMAGE -->
  <div class="logo">
    <img
      src="https://chilliswingsandrings.com/wp-content/uploads/2026/10/NFL-Specials-Hook-3.gif"
      alt="Hook Fish & Chicken NFL Specials"
    >
  </div>

  <!-- NEXT NFL GAME -->
  <div class="section">
    <h2>NFL Next Game</h2>

    <div class="card">
      <div
        class="nfl-game"
        id="nflNextGame"
        aria-live="polite"
      >
        Loading next NFL game...
      </div>
    </div>
  </div>

  <!-- NFL SPECIALS -->
  <div class="section">
    <h2>NFL Game Day Specials</h2>

    <!-- SPECIAL 1 -->
    <div class="card" style="--delay:.05s;">
      <img
        src="https://chilliswingsandrings.com/wp-content/uploads/2026/10/NFL-Specials-Hook-6.gif"
        alt="NFL Game Day Special 1"
      >
    </div>

    <!-- SPECIAL 2 -->
    <div class="card" style="--delay:.12s;">
      <img
        src="https://chilliswingsandrings.com/wp-content/uploads/2026/10/NFL-Specials-Hook-5.gif"
        alt="NFL Game Day Special 2"
      >
    </div>

    <!-- SPECIAL 3 -->
    <div class="card" style="--delay:.19s;">
      <img
        src="https://chilliswingsandrings.com/wp-content/uploads/2026/10/NFL-Specials-Hook-4.gif"
        alt="NFL Game Day Special 3"
      >
    </div>

  </div>

</div>

<!-- CALL BUTTON -->
<div class="cta">
  <a href="tel:+15139780829">
    Call Now - (513) 978-0829
  </a>
</div>

<script>

const nflContainer =
  document.getElementById("nflNextGame");

// Create a team display from nfl.json
function createTeam(team) {

  const wrapper = document.createElement("div");
  wrapper.className = "nfl-team";

  if (team.logo) {
    const logo = document.createElement("img");
    logo.src = team.logo;
    logo.alt = team.name || "NFL Team";
    logo.loading = "lazy";
    wrapper.appendChild(logo);
  }

  const name = document.createElement("div");
  name.className = "nfl-team-name";
  name.textContent = team.name || "TBD";

  wrapper.appendChild(name);

  return wrapper;
}

// Show a helpful fallback
function showNFLError(messageText) {

  nflContainer.replaceChildren();

  const message = document.createElement("div");
  message.className = "nfl-error";
  message.textContent = messageText + " ";

  const link = document.createElement("a");
  link.href = "https://www.espn.com/nfl/schedule";
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  link.textContent = "View NFL Schedule";

  message.appendChild(link);
  nflContainer.appendChild(message);
}

// Read schedule generated by GitHub Actions
async function loadNextNFLGame() {

  try {

    const response = await fetch(
      "./nfl.json",
      { cache:"no-store" }
    );

    if (!response.ok) {
      throw new Error(
        "Schedule file unavailable: " + response.status
      );
    }

    const data = await response.json();

    if (!Array.isArray(data.games)) {
      throw new Error("Invalid NFL schedule data");
    }

    const now = new Date();

    // Find the earliest future game.
    const games = data.games
      .filter(game => {
        const gameDate = new Date(game.date);

        return (
          !isNaN(gameDate.getTime()) &&
          gameDate > now &&
          game.home &&
          game.away
        );
      })
      .sort(
        (a,b) =>
          new Date(a.date) - new Date(b.date)
      );

    if (!games.length) {
      showNFLError(
        "No upcoming NFL games are currently available."
      );
      return;
    }

    const game = games[0];

    const gameDate = new Date(game.date);

    // Display kickoff in Eastern Time
    const formattedDate =
      new Intl.DateTimeFormat("en-US", {
        timeZone:"America/New_York",
        weekday:"long",
        month:"long",
        day:"numeric",
        year:"numeric",
        hour:"numeric",
        minute:"2-digit",
        timeZoneName:"short"
      }).format(gameDate);

    nflContainer.replaceChildren();

    const matchup = document.createElement("div");
    matchup.className = "nfl-matchup";

    const vs = document.createElement("div");
    vs.className = "nfl-vs";
    vs.textContent = "VS";

    matchup.append(
      createTeam(game.away),
      vs,
      createTeam(game.home)
    );

    const date = document.createElement("div");
    date.className = "nfl-date";
    date.textContent = formattedDate;

    const status = document.createElement("div");
    status.className = "nfl-status";
    status.textContent = "UPCOMING NFL GAME";

    nflContainer.append(
      matchup,
      date,
      status
    );

  } catch (error) {

    console.error("NFL loading error:", error);

    showNFLError(
      "Unable to load the NFL schedule."
    );

  }
}

// Initial load
loadNextNFLGame();

// Check for new schedule data every 15 minutes
setInterval(loadNextNFLGame, 15*60*1000);

</script>

</body>
</html>
